<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#D94800"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with subtle bevel border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Architectural Roof Line -->
  <path d="M32 11 L13 26 L18 26 L32 15 L46 26 L51 26 Z" fill="url(#roofGrad)" filter="url(#glow)"/>

  <!-- Brand Initials КС (КазаньСтрой) -->
  <text x="32" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Rubik', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">КС</text>
  
  <!-- Small tool/spark accent -->
  <circle cx="49" cy="15" r="2.5" fill="#FFE066"/>
</svg>
